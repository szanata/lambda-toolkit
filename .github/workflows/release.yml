name: Release

on:
  push:
    branches: [master, 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    name: Version or Publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    container:
      image: node:24.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Build
        run: ./ops/build.sh

      # Hotfixes on an older release line must not move the npm "latest" tag.
      - name: Resolve npm dist-tag
        id: dist-tag
        run: ./ops/npm_dist_tag.sh >> "$GITHUB_OUTPUT"

      - name: Create version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish --tag ${{ steps.dist-tag.outputs.tag }}
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
