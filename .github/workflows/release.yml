name: Release

on:
  push:
    branches: [master, 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main:
    name: Version or Publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Enable pnpm
        run: corepack enable

      - name: Build
        run: ./ops/build.sh

      # Hotfixes on an older release line must not move the npm "latest" tag.
      - name: Resolve npm dist-tag
        id: dist-tag
        run: ./ops/resolve_npm_dist_tag.sh >> "$GITHUB_OUTPUT"

      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish --tag ${{ steps.dist-tag.outputs.tag }}
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A revert can remove the changesets a release PR was built from; that PR must not be merged.
      - name: Close stale release PR
        if: ${{ steps.changesets.outputs.has-changesets == 'false' }}
        run: ./ops/close_stale_release_pr.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
