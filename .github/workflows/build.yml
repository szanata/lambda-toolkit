name: Build

on:
  pull_request:
    branches: [master, 'release/**']

jobs:
  main:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: node:24.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Enable pnpm
        run: corepack enable

      - name: Build
        run: ./ops/build.sh
