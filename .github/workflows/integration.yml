name: Integration

# On demand only, from the Actions tab
on:
  workflow_dispatch:

jobs:
  main:
    name: Integration tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MiniStack + Terraform + build + tests, all in Docker; always tears down
      - name: Run integration tests
        run: ./ops/integration/run.sh ci
