version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: "master"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    target-branch: "master"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-updates:
        update-types: ['patch', 'minor']
        applies-to: 'version-updates'
    cooldown:
      default-days: 7
